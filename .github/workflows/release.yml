name: Release Windows installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Validate tag version
        shell: powershell
        run: |
          [xml]$project = Get-Content TFGLauncher.csproj
          $version = $project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match project version $version" }
          "TFG_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build launcher
        shell: powershell
        run: dotnet publish TFGLauncher.csproj -c Release -o bin/publish
      - name: Build installer
        shell: powershell
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\TFGLauncher.iss'
      - name: Install on clean Windows runner
        shell: powershell
        run: |
          $setup = (Resolve-Path "artifacts\TFG-Launcher-Setup-$env:TFG_VERSION.exe").Path
          $process = Start-Process $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed with exit code $($process.ExitCode)" }
          $launcher = "$env:LOCALAPPDATA\TFGLauncher\app\TFG Launcher.exe"
          if (-not (Test-Path $launcher)) { throw "Installed launcher was not found" }
          & $launcher --self-test
          if ($LASTEXITCODE -ne 0) { throw "Installed launcher self-test failed" }
      - name: Sign update
        shell: pwsh
        env:
          TFG_UPDATE_SIGNING_KEY: ${{ secrets.TFG_UPDATE_SIGNING_KEY }}
        run: |
          if (-not $env:TFG_UPDATE_SIGNING_KEY) { throw "Repository secret TFG_UPDATE_SIGNING_KEY is missing" }
          $file = Get-Item "artifacts\TFG-Launcher-Setup-$env:TFG_VERSION.exe"
          $pem = $env:TFG_UPDATE_SIGNING_KEY.Replace('\n', "`n")
          $base64 = $pem -replace '-----BEGIN PRIVATE KEY-----', '' -replace '-----END PRIVATE KEY-----', '' -replace '\s', ''
          $privateKey = [Convert]::FromBase64String($base64)
          $key = [System.Security.Cryptography.ECDsa]::Create()
          $bytesRead = 0
          $key.ImportPkcs8PrivateKey($privateKey, [ref]$bytesRead)
          $signature = $key.SignData(
            [System.IO.File]::ReadAllBytes($file.FullName),
            [System.Security.Cryptography.HashAlgorithmName]::SHA256,
            [System.Security.Cryptography.DSASignatureFormat]::Rfc3279DerSequence)
          [System.IO.File]::WriteAllBytes("$($file.FullName).sig", $signature)
          $key.Dispose()
      - name: Verify update signature with launcher code
        shell: powershell
        run: |
          $file = Get-Item "artifacts\TFG-Launcher-Setup-$env:TFG_VERSION.exe"
          dotnet run --project TFGLauncher.csproj -c Release -- --verify-update $file.FullName "$($file.FullName).sig"
          if ($LASTEXITCODE -ne 0) { throw "Launcher rejected update signature" }
      - name: Write SHA-256
        shell: powershell
        run: |
          $file = Get-Item "artifacts\TFG-Launcher-Setup-$env:TFG_VERSION.exe"
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($file.Name)" | Set-Content -Encoding ascii artifacts\SHA256SUMS.txt
      - name: Create GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME "artifacts\TFG-Launcher-Setup-$env:TFG_VERSION.exe" "artifacts\TFG-Launcher-Setup-$env:TFG_VERSION.exe.sig" artifacts\SHA256SUMS.txt --verify-tag --generate-notes --title "TFG Launcher $env:TFG_VERSION"
