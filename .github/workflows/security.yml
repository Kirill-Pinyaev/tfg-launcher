name: Launcher security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Build and self-test
        shell: powershell
        run: |
          dotnet restore TFGLauncher.csproj
          dotnet build TFGLauncher.csproj -c Release --no-restore
          dotnet run --project TFGLauncher.csproj -c Release --no-build -- --self-test
      - name: Reject forged signature
        shell: powershell
        run: |
          Set-Content -Encoding ascii forged.bin "forged"
          [IO.File]::WriteAllBytes("forged.sig", (1..72))
          $process = Start-Process dotnet -ArgumentList "run --project TFGLauncher.csproj -c Release --no-build -- --verify-update forged.bin forged.sig" -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -eq 0) { throw "Forged signature was accepted" }
      - name: Vulnerable dependencies
        shell: powershell
        run: |
          $report = dotnet list TFGLauncher.csproj package --vulnerable --include-transitive
          $report
          if ($report -match 'has the following vulnerable packages') { throw "Vulnerable package found" }
      - name: Scan Git history for secrets
        shell: powershell
        run: |
          $version = "8.30.1"
          $archive = "gitleaks_${version}_windows_x64.zip"
          $base = "https://github.com/gitleaks/gitleaks/releases/download/v$version"
          Invoke-WebRequest "$base/$archive" -OutFile $archive
          Invoke-WebRequest "$base/gitleaks_${version}_checksums.txt" -OutFile checksums.txt
          $expected = ((Select-String -Path checksums.txt -Pattern "  $([regex]::Escape($archive))$").Line -split '\s+')[0]
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if (-not $expected -or $actual -ne $expected) { throw "Gitleaks checksum mismatch" }
          Expand-Archive $archive -DestinationPath gitleaks
          .\gitleaks\gitleaks.exe git --redact --verbose
